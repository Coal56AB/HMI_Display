[platformio]
src_dir = main
default_envs = display
build_dir = ../../.build/esp32

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 1048576
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts =
    pre:scons_compat.py
    pre:module_config.py

[env:display]
board_build.cmake_extra_args = -DHMI_TEMPLATE=OFF

[env:template]
board_build.cmake_extra_args = -DHMI_TEMPLATE=ON
